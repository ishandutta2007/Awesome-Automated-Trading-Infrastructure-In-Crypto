<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="50%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="accentGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="candlegreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="candlered" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>

    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glowSubtle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.4" />
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.25" />
    </pattern>

    <style>
      @keyframes chartPulse {
        0%, 100% { stroke-dashoffset: 0; opacity: 0.85; }
        50% { stroke-dashoffset: 40; opacity: 1; }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
      }
      @keyframes pulseAura {
        0%, 100% { opacity: 0.25; transform: scale(1); }
        50% { opacity: 0.45; transform: scale(1.08); }
      }
      @keyframes beamMove {
        0% { transform: translateX(-600px); }
        100% { transform: translateX(1200px); }
      }
      .chart-line {
        stroke-dasharray: 800;
        animation: chartPulse 8s ease-in-out infinite;
      }
      .floating-element {
        animation: floatSlow 6s ease-in-out infinite;
      }
      .aura {
        transform-origin: center;
        animation: pulseAura 7s ease-in-out infinite;
      }
      .light-beam {
        animation: beamMove 9s linear infinite;
      }
      .mono-text {
        font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      }
    </style>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="420" fill="url(#bgGradient)" rx="16" />

  <!-- Grid Overlay -->
  <rect width="1200" height="420" fill="url(#grid)" rx="16" />

  <!-- Dynamic Background Glow Elements (Strictly Behind Foreground Text) -->
  <g opacity="0.6">
    <circle class="aura" cx="220" cy="180" r="160" fill="#06b6d4" opacity="0.12" filter="blur(50px)" />
    <circle class="aura" cx="980" cy="220" r="180" fill="#8b5cf6" opacity="0.14" filter="blur(60px)" />
    <circle class="aura" cx="600" cy="380" r="220" fill="#3b82f6" opacity="0.10" filter="blur(70px)" />
  </g>

  <!-- Background Animated Candlesticks & Charts (Low Opacity, Depth Effect) -->
  <g opacity="0.28" transform="translate(0, 40)">
    <!-- Candlestick cluster right -->
    <!-- Candle 1 -->
    <line x1="880" y1="210" x2="880" y2="330" stroke="#10b981" stroke-width="2" />
    <rect x="872" y="235" width="16" height="65" rx="3" fill="url(#candlegreen)" />
    <!-- Candle 2 -->
    <line x1="915" y1="190" x2="915" y2="305" stroke="#ef4444" stroke-width="2" />
    <rect x="907" y="215" width="16" height="50" rx="3" fill="url(#candlered)" />
    <!-- Candle 3 -->
    <line x1="950" y1="160" x2="950" y2="280" stroke="#10b981" stroke-width="2" />
    <rect x="942" y="180" width="16" height="75" rx="3" fill="url(#candlegreen)" />
    <!-- Candle 4 -->
    <line x1="985" y1="130" x2="985" y2="250" stroke="#10b981" stroke-width="2" />
    <rect x="977" y="145" width="16" height="85" rx="3" fill="url(#candlegreen)" />
    <!-- Candle 5 -->
    <line x1="1020" y1="150" x2="1020" y2="270" stroke="#ef4444" stroke-width="2" />
    <rect x="1012" y="170" width="16" height="60" rx="3" fill="url(#candlered)" />
    <!-- Candle 6 -->
    <line x1="1055" y1="110" x2="1055" y2="230" stroke="#10b981" stroke-width="2" />
    <rect x="1047" y="125" width="16" height="80" rx="3" fill="url(#candlegreen)" />
    <!-- Candle 7 -->
    <line x1="1090" y1="90" x2="1090" y2="210" stroke="#10b981" stroke-width="2" />
    <rect x="1082" y="105" width="16" height="75" rx="3" fill="url(#candlegreen)" />
  </g>

  <!-- Dynamic Flowing Trend Wave (Chart Curve) -->
  <g opacity="0.45">
    <path class="chart-line" d="M 0,340 Q 200,320 350,270 T 700,240 T 950,180 T 1200,120 L 1200,420 L 0,420 Z" fill="url(#accentGreen)" opacity="0.3" />
    <path class="chart-line" d="M 0,340 Q 200,320 350,270 T 700,240 T 950,180 T 1200,120" fill="none" stroke="url(#accentCyan)" stroke-width="3.5" filter="url(#glowSubtle)" />
  </g>

  <!-- Subtle Horizontal Scan Line -->
  <g opacity="0.3">
    <line x1="0" y1="380" x2="1200" y2="380" stroke="#334155" stroke-width="1" stroke-dasharray="6 6" />
    <circle cx="950" cy="180" r="6" fill="#38bdf8" filter="url(#glowCyan)" />
    <circle cx="950" cy="180" r="14" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.5" />
    <circle cx="700" cy="240" r="5" fill="#10b981" filter="url(#glowSubtle)" />
    <circle cx="350" cy="270" r="5" fill="#818cf8" filter="url(#glowSubtle)" />
  </g>

  <!-- FOREGROUND LAYER: Brand Icon, Header, Titles, Subtitle, Badges (Crisp & High Contrast) -->
  <g class="mono-text">
    <!-- Top Pill / Category Badge -->
    <g transform="translate(60, 48)">
      <rect width="250" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6" />
      <circle cx="16" cy="16" r="4.5" fill="#10b981" filter="url(#glowSubtle)" />
      <text x="32" y="21" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1.2">CURATED ECOSYSTEM 2026</text>
    </g>

    <!-- Main Title (Double layered for clean drop-shadow and zero background clipping) -->
    <text x="60" y="132" font-size="44" font-weight="900" fill="#000000" opacity="0.6" letter-spacing="-0.5">
      Awesome Crypto Automated Trading
    </text>
    <text x="60" y="130" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      Awesome Crypto Automated Trading
    </text>

    <!-- Title Line 2 with Gradient Accent -->
    <text x="60" y="184" font-size="44" font-weight="900" fill="url(#accentCyan)" filter="url(#glowSubtle)" letter-spacing="-0.5">
      Infrastructure &amp; Algorithms
    </text>

    <!-- Subtitle / Mission Statement -->
    <text x="60" y="232" font-size="17" font-weight="500" fill="#cbd5e1" letter-spacing="0.2">
      Institutional Execution Engines • Algorithmic Trading Frameworks • Market Making Infrastructure • CEX &amp; DEX APIs
    </text>

    <!-- Decorative Divider Line -->
    <line x1="60" y1="262" x2="1140" y2="262" stroke="#334155" stroke-width="1.5" stroke-opacity="0.8" />

    <!-- Feature Tags / Metric Pills (Row along the bottom) -->
    <!-- Pill 1: Market Making -->
    <g transform="translate(60, 288)">
      <rect width="235" height="48" rx="10" fill="url(#pillGrad)" stroke="#334155" stroke-width="1.2" />
      <text x="18" y="30" font-size="18">📈</text>
      <text x="48" y="24" font-size="13" font-weight="700" fill="#f8fafc">Market Making</text>
      <text x="48" y="39" font-size="11" font-weight="500" fill="#94a3b8">CLOBs &amp; AMM Liquidity</text>
    </g>

    <!-- Pill 2: Execution Engines -->
    <g transform="translate(315, 288)">
      <rect width="245" height="48" rx="10" fill="url(#pillGrad)" stroke="#334155" stroke-width="1.2" />
      <text x="18" y="30" font-size="18">⚡</text>
      <text x="48" y="24" font-size="13" font-weight="700" fill="#f8fafc">Execution Engines</text>
      <text x="48" y="39" font-size="11" font-weight="500" fill="#94a3b8">Sub-Millisecond HFT &amp; Rust</text>
    </g>

    <!-- Pill 3: Trading Bots & AI -->
    <g transform="translate(580, 288)">
      <rect width="255" height="48" rx="10" fill="url(#pillGrad)" stroke="#334155" stroke-width="1.2" />
      <text x="18" y="30" font-size="18">🤖</text>
      <text x="48" y="24" font-size="13" font-weight="700" fill="#f8fafc">Quant Bots &amp; ML</text>
      <text x="48" y="39" font-size="11" font-weight="500" fill="#94a3b8">FreqAI, Jesse &amp; Hummingbot</text>
    </g>

    <!-- Pill 4: Open & SaaS -->
    <g transform="translate(855, 288)">
      <rect width="285" height="48" rx="10" fill="url(#pillGrad)" stroke="#334155" stroke-width="1.2" />
      <text x="18" y="30" font-size="18">🌐</text>
      <text x="48" y="24" font-size="13" font-weight="700" fill="#f8fafc">Institutional SaaS &amp; OSS</text>
      <text x="48" y="39" font-size="11" font-weight="500" fill="#94a3b8">Multi-Exchange API Standard</text>
    </g>

    <!-- Live Status Indicator Bottom Right -->
    <g transform="translate(970, 375)">
      <circle cx="10" cy="10" r="4" fill="#10b981" filter="url(#glowSubtle)" />
      <text x="24" y="14" font-size="11.5" font-weight="600" fill="#94a3b8" letter-spacing="0.5">Updated October 2026</text>
    </g>
  </g>
</svg>
